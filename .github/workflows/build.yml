name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      runner_label:
        description: "macOS runner label"
        required: false
        default: "macos-14"

jobs:
  build:
    runs-on: ${{ inputs.runner_label || 'macos-14' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head -10

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Unit tests (simulator, non-blocking)
        continue-on-error: true
        run: |
          xcodebuild test -project MstPump.xcodeproj -scheme MstPump \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Build device app (unsigned)
        run: |
          xcodebuild build -project MstPump.xcodeproj -scheme MstPump \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          rm -rf Payload MstPump.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr MstPump-unsigned.ipa Payload
          ls -lh MstPump-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MstPump-unsigned-ipa
          path: MstPump-unsigned.ipa
          retention-days: 14
